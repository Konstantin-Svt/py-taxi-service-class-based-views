{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  {% if driver_list %}
    <ul>
    {% for driver in driver_list %}
      <li><a rel="driver_instance" href="{% url 'taxi:driver-detail' driver.id %}">{{ driver.username }}</a> ({{ driver.first_name }} {{ driver.last_name }})</li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No Drivers</p>
  {% endif %}
{% endblock %}
