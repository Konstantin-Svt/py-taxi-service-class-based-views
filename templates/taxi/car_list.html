{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <ul>
    {% for car in car_list %}
      <li><a rel="car_instance" href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}  {{ car.manufacturer.name }}</a></li>
    {% endfor %}
    </ul>
  {% else %}
    <p>No Cars</p>
  {% endif %}
{% endblock %}
